  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --bg: #0d0d0d;\n    --surface: #141414;\n    --surface2: #1a1a1a;\n    --accent: #c8f04e;\n    --accent2: #f04e9b;\n    --accent3: #4ec8f0;\n    --text: #f0ede6;\n    --muted: #888;\n    --border: rgba(200,240,78,0.15);\n  }\n\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n\n  body {\n    background: var(--bg);\n    color: var(--text);\n    font-family: 'Montserrat', sans-serif;\n    font-weight: 300;\n    line-height: 1.7;\n    overflow-x: hidden;\n  }\n\n  /* GRAIN */\n  body::before {\n    content: '';\n    position: fixed;\n    inset: 0;\n    background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E\");\n    pointer-events: none;\n    z-index: 1000;\n    opacity: 0.5;\n  }\n\n  .container {\n    max-width: 900px;\n    margin: 0 auto;\n    padding: 0 32px;\n  }\n\n  /* HERO */\n  .hero {\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    position: relative;\n    overflow: hidden;\n    padding: 80px 0 60px;\n  }\n\n\n\n  .hero .container {\n    position: relative;\n    z-index: 3;\n  }\n\n  .hero::after {\n    content: '';\n    position: absolute;\n    top: -200px;\n    right: -200px;\n    width: 600px;\n    height: 600px;\n    background: radial-gradient(circle, rgba(200,240,78,0.08) 0%, transparent 70%);\n    pointer-events: none;\n  }\n\n  .hero-label {\n    font-family: 'Unbounded', sans-serif;\n    font-size: 10px;\n    font-weight: 400;\n    letter-spacing: 0.3em;\n    color: var(--accent);\n    text-transform: upperca v>\n          <div class=\"case-what\">Reels и карусели  для клиентских аккаунтов. Органический охват без рекламного бюджета.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"case-result\">\n          <div class=\"case-num\">1 000 000+<\u002Fdiv>\n          <div class=\"case-sub\">просмотров Reels<\u002Fdiv>\n          <div class=\"case-num\" style=\"margin-top:8px; font-size:16px;\">99К / 30К<\u002Fdiv>\n          <div class=\"case-sub\">охват каруселей<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- STORIES -->\n<section>\n  <div class=\"container\">\n    <div class=\"section-label\">04 — Истории учеников<\u002Fdiv>\n    <h2 class=\"section-title fade-in\">Что <em>изменилось<\u002Fem><\u002Fh2>\n    <div class=\"stories-grid fade-in\">\n\n      <div class=\"story-card\">\n        <div class=\"story-num\">01&nbsp;<\u002Fdiv>\n        <div class=\"story-row\">\n          <div class=\"story-label before\">До<\u002Fdiv>\n          <div class=\"story-text before\">Боялась, что не разберётся в нейросетях<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"story-row\">\n          <div class=\"story-label after\">После<\u002Fdiv>\n          <div class=\"story-text after\">Делает открытки на заказ, создала ассистента для зятя-дипломника<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"story-card\">\n        <div class=\"story-num\">02<\u002Fdiv>\n        <div class=\"story-row\">\n          <div class=\"story-label before\">До<\u002Fdiv>\n          <div class=\"story-text before\">Тратила деньги на отшив, чтобы посмотреть как будет смотреться цвет<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"story-row\">\n          <div class=\"story-label after\">После<\u002Fdiv>\n          <div class=\"story-text after\">Меняет цвета готовых изделий с ИИ — без лишних затрат<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"story-card\">\n        <div class=\"story-num\">03<\u002Fdiv>\n        <div class=\"story-row\">\n          <div class=\"story-label before\">До<\u002Fdiv>\n          <div class=\"story-text before\">Непонятно почему не покупают, хотя продукт хвалят<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"story-row\">\n          <div class=\"story-label after\">После<\u002Fdiv>\n          <div class=\"story-text after\">Пересобрала офферы с ИИ → 2 поста → +5 продаж<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"story-card\">\n        <div class=\"story-num\">04<\u002Fdiv>\n        <div class=\"story-row\">\n          <div class=\"story-label before\">До<\u002Fdiv>\n          <div class=\"story-text before\">Хотела научить ИИ рисовать в своём стиле<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"story-row\">\n          <div class=\"story-label after\">После<\u002Fdiv>\n          <div class=\"story-text after\">Создаёт авторскую колоду метафорических карт<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- EXPERTISE -->\n<section>\n  <div class=\"container\">\n    <div class=\"section-label\">05 — Экспертиза<\u002Fdiv>\n    <h2 class=\"section-title fade-in\">С чем работаю <em>глубоко<\u002Fem><\u002Fh2>\n    <div class=\"expertise-tags fade-in\">\n      <span class=\"tag\">Midjourney<\u002Fspan>\n      <span class=\"tag\">Flux / Lora<\u002Fspan>\n      <span class=\"tag\">Kling<\u002Fspan>\n      <span class=\"tag\">Runway<\u002Fspan>\n      <span class=\"tag\">Veo 3<\u002Fspan>\n      <span class=\"tag\">Seedance<\u002Fspan>\n      <span class=\"tag\">ChatGPT<\u002Fspan>\n      <span class=\"tag\">Claude<\u002Fspan>\n      <span class=\"tag\">Gemini / NanoBanana<\u002Fspan>\n      <span class=\"tag\">HeyGen<\u002Fspan>\n      <span class=\"tag\">ElevenLabs<\u002Fspan>\n      <span class=\"tag\">Ideogram<\u002Fspan>\n      <span class=\"tag\">Нейрофотосессии<\u002Fspan>\n      <span class=\"tag\">Нейровидео<\u002Fspan>\n      <span class=\"tag\">Цифровые аватары<\u002Fspan>\n      <span class=\"tag\">Промпт-инжиниринг<\u002Fspan>\n      <span class=\"tag\">Контент-стратегия<\u002Fspan>\n      <span class=\"tag\">SMM с ИИ<\u002Fspan>\n      <span class=\"tag\">Карточки товаров<\u002Fspan>\n      <span class=\"tag\">Видеореклама с ИИ<\u002Fspan>\n      <span class=\"tag\">Анализ ЦА&nbsp;<\u002Fspan>\n      <span class=\"tag\">ИИ-ассистенты&nbsp;<\u002Fspan>\n      <span class=\"tag\">Монтаж CapCut<\u002Fspan>\n      <span class=\"tag\">Canva<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- REVIEWS -->\n<section>\n  <div class=\"container\">\n    <div class=\"section-label\">06 — Отзывы<\u002Fdiv>\n    <h2 class=\"section-title fade-in\">Что говорят <em>ученики и клиенты<\u002Fem><\u002Fh2>\n    <div class=\"reviews-carousel fade-in\">\n      <div class=\"reviews-viewport\">\n        <div class=\"reviews-track\" id=\"reviewsTrack\">\n\n          <div class=\"reviews-slide\">\n            <div class=\"review-card\">\n              <div class=\"review-quote\">\"<\u002Fdiv>\n              <div class=\"review-text\">Нади научила меня так общаться с GPT, что теперь он заменяет мне армию помощников, секретарей, специалистов. Появилось желание создавать новые продукты, а не тратить время на рутинную обработку данных вручную.<\u002Fdiv>\n              <div class=\"review-author\">Участница обучения<\u002Fdiv>\n              <div class=\"review-role\">\n<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"review-card\">\n              <div class=\"review-quote\">\"<\u002Fdiv>\n              <div class=\"review-text\">Я проходила курс за 80 тыс. — и там не было такой глубины. Многие вещи стали для меня открытием.\nблагодарю за вдохновение и такую структурированную подачу. Учиться у вас — легко и приятно. Особенно понравился урок по Runway Aleph — теперь знаю, как работать с ИИ так, чтобы оставалась моя внешность.<\u002Fdiv>\n              <div class=\"review-author\">Запрос на консультации: не покупают продукт (хотя те кто купил, говорят, что он классный).<\u002Fdiv>\n              <div class=\"review-role\">\n<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"reviews-slide\">\n            <div class=\"review-card\">\n              <div class=\"review-quote\">\"<\u002Fdiv>\n              <div class=\"review-text\">Подготовка строится грамотно: сначала даётся база, наглядно показано что и где и как, и с каждым последующим уроком идёт всё более глубокое погружение. Уроки доступные и понятные. Знания применяю в работе — удалось сделать ролики для анонса мероприятий компании.<\u002Fdiv>\n              <div class=\"review-author\">Ученица обучения<\u002Fdiv>\n              <div class=\"review-role\">\n<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"review-card\">\n              <div class=\"review-quote\">\"<\u002Fdiv>\n              <div class=\"review-text\">Благодарю за урок. Главное всё понятно объясняешь.&nbsp; Теперь я могу свои мысли свои идеи реализовать. Мои первые фото -&nbsp; это те которые я точно оставляю для печати, стиль разный, так как для разных колод) ты одна из первых их увидела.<\u002Fdiv>\n              <div class=\"review-author\">Запрос на консультации: научить нейросеть своему стилю для создания метафоричных карт.<\u002Fdiv>\n              <div class=\"review-role\">\n<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"reviews-slide\">\n            <div class=\"review-card\">\n              <div class=\"review-quote\">\"<\u002Fdiv>\n              <div class=\"review-text\">Надежда, выражаю тебе благодарность, было полезно, на самом деле твой опыт нам пригодится, и в дальнейшем, возможно, мы ещё к тебе будем обращаться, и когда релизнем продукт, то мы в любом случае тебе тоже его покажем, всё покажем, расскажем.<\u002Fdiv>\n              <div class=\"review-author\">Запрос на консультацию: нужна помощь в разработке бота для ИИ-фото, как писать правильно промпты, чтобы удержать внешность человека.<\u002Fdiv>\n              <div class=\"review-role\">\n<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"review-card\">\n              <div class=\"review-quote\">\"<\u002Fdiv>\n              <div class=\"review-text\">Я проходила курс за 80 тыс. — и там не было такой глубины. Многие вещи стали для меня открытием. благодарю за вдохновение и такую структурированную подачу. Учиться у вас — легко и приятно. Особенно понравился урок по Runway Aleph — теперь знаю, как работать с ИИ так, чтобы оставалась моя внешность.&nbsp;<\u002Fdiv>\n              <div class=\"review-author\">Ученица обучения<\u002Fdiv>\n              <div class=\"review-role\">\n<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"reviews-slide\">\n            <div class=\"review-card\">\n              <div class=\"review-quote\">\"<\u002Fdiv>\n              <div class=\"review-text\">Надя, привет! Новые сказки сделала, распечатала, правда, пока одну книжку. Открыточки на заказ делала 😁 Зять диплом пишет — создали ему ассистента, проще намного дело пошло, не знал про это.<\u002Fdiv>\n              <div class=\"review-author\">Ученица обучения<\u002Fdiv>\n              <div class=\"review-role\">\n<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"review-card\">\n              <div class=\"review-quote\">\"<\u002Fdiv>\n              <div class=\"review-text\">Привет! Смотри, у меня получилось! В этом кадре всё вышло, как я хотела — чётко переданы поза, цвета, пейзаж, текстура вязаного полотна, свитер связан в оригинале, брюки — генерация.<\u002Fdiv>\n              <div class=\"review-author\">Ученица обучения<\u002Fdiv>\n              <div class=\"review-role\">\n<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"reviews-controls\">\n        <div class=\"reviews-dots\" id=\"reviewsDots\">\n          <button class=\"reviews-dot active\" data-idx=\"0\" aria-label=\"Страница 1\"><\u002Fbutton>\n          <button class=\"reviews-dot\" data-idx=\"1\" aria-label=\"Страница 2\"><\u002Fbutton>\n          <button class=\"reviews-dot\" data-idx=\"2\" aria-label=\"Страница 3\"><\u002Fbutton>\n          <button class=\"reviews-dot\" data-idx=\"3\" aria-label=\"Страница 4\"><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"reviews-arrows\">\n          <button class=\"reviews-arrow\" id=\"reviewsPrev\" aria-label=\"Назад\">←<\u002Fbutton>\n          <button class=\"reviews-arrow\" id=\"reviewsNext\" aria-label=\"Вперёд\">→<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section class=\"contact-section\">\n  <div class=\"container\">\n    <div class=\"section-label\">07 — Контакты<\u002Fdiv>\n    <div class=\"contact-grid fade-in\">\n      <div>\n        <h2 class=\"contact-cta\">Готовы начать?<br>Напишите <em>Нади<\u002Fem><\u002Fh2>\n        <p style=\"font-size:13px; color:var(--muted); margin-top:20px; line-height:1.8;\">Консультация, обучение или вопросы о сотрудничестве — пишите в личные сообщения<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"contact-links\">\n        <a class=\"contact-link\" href=\"https://t.me/nadya_xoma\" target=\"_blank\">\n          <span class=\"contact-link-icon\">✈️<\u002Fspan>\n          <div>\n            <div style=\"font-weight:500;\">Telegram для связи<\u002Fdiv>\n            <div style=\"font-size:12px; color:var(--muted); margin-top:2px;\">@nadya_xoma<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fa>\n        <a class=\"contact-link\" href=\"https://t.me/nadipro_ii\" target=\"_blank\">\n          <span class=\"contact-link-icon\">🔴<\u002Fspan>\n          <div>\n            <div style=\"font-weight:500;\">Telegram-канал<\u002Fdiv>\n            <div style=\"font-size:12px; color:var(--muted); margin-top:2px;\">@nadipro_ii — про нейросети каждый день<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<div class=\"footer\">\n  <div class=\"container\">\n    <p class=\"footer-text\">Нади про ИИ <span class=\"footer-accent\">✦<\u002Fspan> Медиакит 2026 <span class=\"footer-accent\">✦<\u002Fspan> @nadipro_ii<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n  const observer = new IntersectionObserver((entries) => {\n    entries.forEach((entry, i) => {\n      if (entry.isIntersecting) {\n        setTimeout(() => {\n          entry.target.classList.add('visible');\n        }, 100);\n        observer.unobserve(entry.target);\n      }\n    });\n  }, { threshold: 0.1 });\n\n  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));\n\n  // Reviews carousel\n  (function() {\n    const track = document.getElementById('reviewsTrack');\n    const prev = document.getElementById('reviewsPrev');\n    const next = document.getElementById('reviewsNext');\n    const dots = document.querySelectorAll('#reviewsDots .reviews-dot');\n    if (!track || !prev || !next) return;\n    const total = track.children.length;\n    let idx = 0;\n\n    function update() {\n      track.style.transform = 'translateX(-' + (idx * 100) + '%)';\n      dots.forEach((d, i) => d.classList.toggle('active', i === idx));\n      prev.disabled = idx === 0;\n      next.disabled = idx === total - 1;\n    }\n\n    prev.addEventListener('click', () => { if (idx > 0) { idx--; update(); } });\n    next.addEventListener('click', () => { if (idx < total - 1) { idx++; update(); } });\n    dots.forEach((d, i) => d.addEventListener('click', () => { idx = i; update(); }));\n\n    // Swipe support\n    let startX = null;\n    track.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });\n    track.addEventListener('touchend', (e) => {\n      if (startX === null) return;\n      const dx = e.changedTouches[0].clientX - startX;\n      if (dx < -40 && idx < total - 1) { idx++; update(); }\n      else if (dx > 40 && idx > 0) { idx--; update(); }\n      startX = null;\n    });\n\n    update();\n  })();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
